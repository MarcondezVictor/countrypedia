<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contributors — world.com</title>
    <link rel="stylesheet" href="../style.css">
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-inner">
            <a href="../index.html" class="navbar-logo">world.com</a>
            <div class="navbar-search">
                <input type="text" id="searchInput" placeholder="Search countries...">
                <button>Search</button>
            </div>
            <nav class="navbar-links" id="navLinks">
                <a href="countries.html">Countries</a>
                <a href="continents.html">Continents</a>
                <a href="contributors.html">Contributors</a>
                <a href="quiz.html">Quiz</a>
                <a href="#" onclick="randomCountry()">Random</a>
            </nav>
            <button class="navbar-hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <main class="container">
        <div class="window">
            <div class="window-titlebar">
                <div class="window-title">
                    <span>Community Contributors</span>
                </div>
                <div class="window-buttons">
                    <button class="window-btn">_</button>
                    <button class="window-btn">□</button>
                    <button class="window-btn">X</button>
                </div>
            </div>

            <div class="window-content">

                <!-- STATS -->
                <div class="stats-bar">
                    <span>Total contributions: <strong id="totalContribs">0</strong></span>
                    <span>Countries improved: <strong id="totalCountries">0</strong></span>
                </div>

                <div class="sort-bar">
                    <span>Sort by:</span>
                    <select id="sortSelect" onchange="changeSort()">
                        <option value="contributions-desc">Most contributions</option>
                        <option value="contributions-asc">Least contributions</option>
                        <option value="name-asc">Name A → Z</option>
                        <option value="name-desc">Name Z → A</option>
                    </select>
                    <span>Continent:</span>
                    <select id="continentSelect" onchange="changeContinent()">
                        <option value="All">All</option>
                    </select>
                </div>

                <!-- TOP 3 PODIUM -->
                <div id="podium" style="display:flex; gap:8px; padding:8px; border-bottom: 2px solid var(--border-dark);"></div>

                <!-- TABELA -->
                <table class="countries-table" id="contribTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Flag</th>
                            <th>Country</th>
                            <th>Continent</th>
                            <th>Contributions</th>
                        </tr>
                    </thead>
                    <tbody id="contribBody"></tbody>
                </table>

                <div class="statusbar">
                    <span class="statusbar-item" id="contribStatus"></span>
                </div>

            </div>
        </div>
    </main>

    <footer>
        <p>world.com &copy; 2026 — The Country Encyclopedia</p>
    </footer>

    <script src="../script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            buildContinentFilter();
            buildContributors();

            document.getElementById("hamburger").addEventListener("click", () => {
                document.getElementById("navLinks").classList.toggle("open");
            });

            document.getElementById("searchInput").addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    const term = document.getElementById("searchInput").value.trim();
                    if (term) window.location.href = `../index.html?search=${encodeURIComponent(term)}`;
                }
            });
        });

        function randomCountry() {
            const random = countries[Math.floor(Math.random() * countries.length)];
            window.location.href = `country.html?iso=${random.iso}`;
        }

        let activeSort = "contributions-desc";
        let activeContinent = "All";

        function changeSort() {
            activeSort = document.getElementById("sortSelect").value;
            buildContributors();
        }

        function changeContinent() {
            activeContinent = document.getElementById("continentSelect").value;
            buildContributors();
        }

        function buildContinentFilter() {
            const select = document.getElementById("continentSelect");
            const continents = [...new Set(countries.map(c => c.continent))].sort();
            continents.forEach(cont => {
                const opt = document.createElement("option");
                opt.value = cont;
                opt.textContent = cont;
                select.appendChild(opt);
            });
        }

        function buildContributors() {
            let filtered = countries.filter(c => c.contributions && c.contributions > 0);

            if (activeContinent !== "All") {
                filtered = filtered.filter(c => c.continent === activeContinent);
            }

            filtered.sort((a, b) => {
                switch (activeSort) {
                    case "contributions-desc": return b.contributions - a.contributions;
                    case "contributions-asc":  return a.contributions - b.contributions;
                    case "name-asc":           return a.name.localeCompare(b.name);
                    case "name-desc":          return b.name.localeCompare(a.name);
                    default:                   return b.contributions - a.contributions;
                }
            });

            const totalContribs = countries.reduce((sum, c) => sum + (c.contributions || 0), 0);
            document.getElementById("totalContribs").textContent = totalContribs;
            document.getElementById("totalCountries").textContent =
                countries.filter(c => c.contributions && c.contributions > 0).length;

            // --- PODIUM TOP 3 ---
            const podium = document.getElementById("podium");
            podium.innerHTML = "";

            const medals = [
                { label: "1st", border: "#FFD700" },  // ouro
                { label: "2nd", border: "#708090" },  // prata mais escuro
                { label: "3rd", border: "#CD7F32" }   // bronze
            ];

            filtered.slice(0, 3).forEach((country, index) => {
                const m = medals[index];
                const card = document.createElement("div");
                card.style.cssText = `
                    flex: 1;
                    border-top: 2px solid var(--border-light);
                    border-left: 2px solid var(--border-light);
                    border-bottom: 2px solid var(--border-dark);
                    border-right: 2px solid var(--border-dark);
                    outline: 2px solid ${m.border};
                    background: var(--bg);
                    cursor: pointer;
                    text-align: center;
                    padding: 8px;
                `;
                card.onclick = () => { window.location.href = `country.html?iso=${country.iso}`; };

                card.innerHTML = `
                    <div style="
                        background: ${m.border};
                        color: #000;
                        font-weight: bold;
                        font-size: var(--text-sm);
                        padding: 2px 0;
                        margin-bottom: 8px;
                    ">${m.label} Place</div>
                    <img src="../flags/${country.iso}.svg"
                        style="width:64px;height:43px;object-fit:contain;background:var(--bg);display:block;margin:0 auto 6px;">
                    <div style="font-weight:bold;font-size:var(--text-sm);">${country.name}</div>
                    <div style="font-size:var(--text-sm);color:var(--text-muted);">${country.continent}</div>
                    <div style="
                        font-size: var(--text-lg);
                        font-weight: bold;
                        color: var(--titlebar);
                        margin-top: 4px;
                    ">${country.contributions}</div>
                    <div style="font-size:11px;color:var(--text-muted);">contributions</div>
                `;

                podium.appendChild(card);
            });

            // esconde podium se menos de 3 países
            podium.style.display = filtered.length >= 3 ? "flex" : "none";

            // --- TABELA (começa no 4º) ---
            const body = document.getElementById("contribBody");
            body.innerHTML = "";

            filtered.slice(3).forEach((country, index) => {
                const tr = document.createElement("tr");
                tr.style.cursor = "pointer";
                tr.onclick = () => { window.location.href = `country.html?iso=${country.iso}`; };

                tr.innerHTML = `
                    <td><strong>${index + 4}th</strong></td>
                    <td><img src="../flags/${country.iso}.svg"
                        style="width:32px;height:21px;object-fit:contain;background:var(--bg);display:block;"></td>
                    <td><strong>${country.name}</strong></td>
                    <td>${country.continent}</td>
                    <td><strong style="color:var(--titlebar)">${country.contributions}</strong></td>
                `;

                body.appendChild(tr);
            });

            document.getElementById("contribStatus").textContent =
                `${filtered.length} countries with community contributions`;
        }
    </script>

</body>
</html>
