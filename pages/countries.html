<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport: adapta ao ecrã do dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countries — Countrypedia</title>
    <!-- CSS com caminho relativo (estamos dentro de /pages/, por isso "../") -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- ================================================
         NAVBAR — igual à home mas com "Countries" ativo.
         Usa Flexbox internamente (ver .navbar-inner no CSS).
         ================================================ -->
    <nav class="navbar">
        <div class="navbar-inner">
            <!-- <a> com <img> — logo como hiperligação pra a home -->
            <a href="../index.html" class="navbar-logo">
                <img src="../images/logo.png" alt="Countrypedia logo"> <!-- caminho relativo com ../ -->
                Countrypedia
            </a>
            <!-- campo de pesquisa: em tempo real atualiza a tabela -->
            <div class="navbar-search">
                <input type="text" id="searchInput" placeholder="Search countries...">
                <button onclick="search()">Search</button>
            </div>
            <!-- links de navegação — "Countries" tem classe active (destaque azul) -->
            <nav class="navbar-links" id="navLinks">
                <a href="countries.html" class="active">Countries</a>
                <a href="continents.html">Continents</a>
                <a href="stats.html">Rankings</a>
                <a href="compare.html">Compare</a>
                <a href="#" onclick="randomCountry()">Random</a>
            </nav>
            <!-- hamburger: mostra o menu em mobile -->
            <button class="navbar-hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- ================================================
         CONTEÚDO PRINCIPAL — janela Win95 com a tabela
         ================================================ -->
    <main class="container">
        <div class="window">

            <!-- barra de título da janela -->
            <div class="window-titlebar">
                <div class="window-title">
                    <span>Countries List</span>
                </div>
                <div class="window-buttons">
                    <button class="window-btn">_</button>
                    <button class="window-btn">□</button>
                    <button class="window-btn">✕</button>
                </div>
            </div>

            <div class="window-content">

                <!-- BARRA DE FERRAMENTAS — ordenação e filtro de continente.
                     Os <select> chamam JS ao mudar (onchange). -->
                <div class="sort-bar">
                    <span>Sort by:</span>
                    <!-- <select> de ordenação — chama changeSort() em countries.js -->
                    <select id="sortSelect" onchange="changeSort()">
                        <option value="name-asc">Name A → Z</option>
                        <option value="name-desc">Name Z → A</option>
                        <option value="population-desc">Most populated</option>
                        <option value="population-asc">Least populated</option>
                        <option value="area-desc">Largest area</option>
                        <option value="area-asc">Smallest area</option>
                        <option value="idh-desc">Highest HDI</option>
                        <option value="idh-asc">Lowest HDI</option>
                        <option value="continent-asc">Continent A → Z</option>
                        <option value="continent-desc">Continent Z → A</option>
                    </select>
                    <span>Continent:</span>
                    <!-- <select> de continente — a opção "All" está no HTML,
                         as restantes são adicionadas pelo JS (buildContinentFilter) -->
                    <select id="continentSelect" onchange="changeContinent()">
                        <option value="All">All</option>
                    </select>
                    <!-- contador de resultados, preenchido pelo JS -->
                    <span id="resultCount" style="margin-left:auto;"></span>
                </div>

                <!-- TABELA DE PAÍSES
                     <table> é usada aqui porque os dados são tabulares.
                     - <thead> contém os cabeçalhos clicáveis para ordenar
                     - <tbody> é preenchido dinamicamente pelo JS (buildTable)
                     Os onclick nos <th> chamam setSort() em countries.js -->
                <table class="countries-table" id="countriesTable">
                    <thead>
                        <tr>
                            <!-- <th> — cabeçalho de coluna da tabela -->
                            <th>Flag</th>
                            <th onclick="setSort('name-asc', 'name-desc')">Country ↕</th>
                            <th onclick="setSort('name-asc', 'name-desc')">Capital ↕</th>
                            <th onclick="setSort('population-desc', 'population-asc')">Population ↕</th>
                            <th onclick="setSort('area-desc', 'area-asc')">Area ↕</th>
                            <th onclick="setSort('idh-desc', 'idh-asc')">HDI ↕</th>
                            <th onclick="setSort('continent-asc', 'continent-desc')">Continent ↕</th>
                        </tr>
                    </thead>
                    <!-- <tbody> vazio — o JS injeta as <tr> aqui -->
                    <tbody id="countriesBody"></tbody>
                </table>

                <!-- PAGINAÇÃO — botões gerados pelo JS (buildPagination) -->
                <div class="pagination" id="pagination"></div>

                <!-- STATUS BAR — mostra quantos países estão visíveis -->
                <div class="statusbar">
                    <span class="statusbar-item" id="statusText">Loading...</span>
                </div>

            </div>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>Countrypedia &copy; 2026 — The Country Encyclopedia</p>
    </footer>

    <!-- SCRIPTS — script.js primeiro (dados), depois countries.js (lógica) -->
    <script src="../script.js"></script>       <!-- array countries[] -->
    <script src="../js/countries.js"></script> <!-- lógica desta página -->

</body>
</html>
